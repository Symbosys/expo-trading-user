<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpoTradex - Crypto Investment Platform</title>
    <meta
      name="description"
      content="ExpoTradex - Professional crypto and forex trading platform for investment management"
    />
    <meta name="cryptomus" content="743ff92d" />
    <meta name="author" content="ExpoTradex" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta
      property="og:title"
      content="ExpoTradex - Crypto Investment Platform"
    />
    <meta
      property="og:description"
      content="Professional crypto and forex trading platform for investment management"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta
      name="twitter:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"
    />

    <!-- JSON-LD Structured Data for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExpoTradex",
        "url": "https://expotradex.com",
        "logo": "https://expotradex.com/logo.png",
        "description": "Professional crypto and forex trading platform",
        "sameAs": [
          "https://twitter.com/expotradex",
          "https://facebook.com/expotradex",
          "https://linkedin.com/company/expotradex"
        ]
      }
    </script>
  </head>

  <body>
    <div id="main">
      <style>
        :root {
          color-scheme: dark;
          font-family: Georgia, "Times New Roman", serif;
          background: #101214;
          color: #e8e7e2;
          font-synthesis: none;
          text-rendering: optimizeLegibility;
        }

        * {
          box-sizing: border-box;
        }

        body {
          min-width: 320px;
          min-height: 100vh;
          margin: 0;
          background:
            radial-gradient(ellipse at 50% 44%, #1c2022 0, #101214 60%),
            #101214;
        }

        .outage-page {
          min-height: 100vh;
          display: grid;
          grid-template-rows: auto 1fr auto;
          padding: 0 clamp(24px, 7vw, 104px);
        }

        .site-header,
        .site-footer {
          display: flex;
          align-items: center;
          justify-content: space-between;
          color: #999b98;
          font: 11px/1.5 "Courier New", monospace;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        .site-header {
          min-height: 82px;
          border-bottom: 1px solid #303335;
        }

        .brand {
          color: #e8e7e2;
          font: 600 13px/1.2 "Courier New", monospace;
          letter-spacing: 0.16em;
        }

        .header-note {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .status-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #d39b59;
          box-shadow: 0 0 12px #d39b5966;
        }

        .message {
          width: min(100%, 720px);
          align-self: center;
          justify-self: center;
          padding: 72px 0 86px;
        }

        .error-code {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 34px;
          color: #d39b59;
          font: 12px/1.4 "Courier New", monospace;
          letter-spacing: 0.13em;
          text-transform: uppercase;
        }

        .error-code::before {
          width: 30px;
          height: 1px;
          background: currentColor;
          content: "";
        }

        h1 {
          max-width: 650px;
          margin: 0;
          font-size: clamp(42px, 7vw, 76px);
          font-weight: 400;
          letter-spacing: -0.055em;
          line-height: 0.99;
        }

        .description {
          max-width: 490px;
          margin: 28px 0 0;
          color: #a5a7a4;
          font: 16px/1.8 "Courier New", monospace;
        }

        .divider {
          width: 100%;
          height: 1px;
          margin: 40px 0 24px;
          background: #303335;
        }

        .detail {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 20px;
          color: #747875;
          font: 11px/1.6 "Courier New", monospace;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .retry {
          min-height: 46px;
          margin-top: 38px;
          padding: 0 20px;
          border: 1px solid #77766f;
          border-radius: 0;
          background: transparent;
          color: #e8e7e2;
          cursor: pointer;
          font: 12px/1 "Courier New", monospace;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          transition: border-color 160ms ease, background 160ms ease;
        }

        .retry:hover {
          border-color: #d39b59;
          background: #d39b5912;
        }

        .retry:focus-visible {
          outline: 2px solid #d39b59;
          outline-offset: 4px;
        }

        .site-footer {
          min-height: 66px;
          border-top: 1px solid #303335;
          color: #6f7370;
          letter-spacing: 0.06em;
          text-transform: none;
        }

        @media (max-width: 560px) {
          .site-header {
            min-height: 70px;
          }

          .header-note {
            font-size: 9px;
          }

          .message {
            padding: 54px 0 64px;
          }

          .description {
            font-size: 14px;
          }

          .detail {
            align-items: flex-start;
            flex-direction: column;
            gap: 6px;
          }

          .site-footer {
            align-items: flex-start;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 14px 0;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          *,
          *::before,
          *::after {
            scroll-behavior: auto !important;
            transition-duration: 0.01ms !important;
          }
        }
      </style>

      <header class="site-header">
        <span class="brand">EXPOTRADEX</span>
        <span class="header-note"><span class="status-dot" aria-hidden="true"></span>Service interruption</span>
      </header>

      <section class="message" aria-labelledby="outage-title">
        <div class="error-code">HTTP 503 · Service unavailable</div>
        <h1 id="outage-title">We’ll be back shortly.</h1>
        <p class="description">
          We’re temporarily unable to load this page. Please wait a moment, then try again.
        </p>
        <div class="divider" role="presentation"></div>
        <div class="detail">
          <span>Request could not be completed</span>
          <span>Please try again shortly</span>
        </div>
        <button class="retry" type="button" onclick="window.location.reload()">Try again</button>
      </section>

      <footer class="site-footer">
        <span>ExpoTradex</span>
        <span>We apologize for the interruption.</span>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
