<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpoTradex - Crypto Investment Platform</title>
    <meta
      name="description"
      content="ExpoTradex - Professional crypto and forex trading platform for investment management"
    />
    <meta name="cryptomus" content="743ff92d" />
    <meta name="author" content="ExpoTradex" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta
      property="og:title"
      content="ExpoTradex - Crypto Investment Platform"
    />
    <meta
      property="og:description"
      content="Professional crypto and forex trading platform for investment management"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta
      name="twitter:image"
      content="https://lovable.dev/opengraph-image-p98pqg.png"
    />

    <!-- JSON-LD Structured Data for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExpoTradex",
        "url": "https://expotradex.com",
        "logo": "https://expotradex.com/logo.png",
        "description": "Professional crypto and forex trading platform",
        "sameAs": [
          "https://twitter.com/expotradex",
          "https://facebook.com/expotradex",
          "https://linkedin.com/company/expotradex"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root">
      <style>
        :root {
          color-scheme: light;
          font-family: Arial, Helvetica, sans-serif;
          background: #f6f8fa;
          color: #202938;
          font-synthesis: none;
        }

        * {
          box-sizing: border-box;
        }

        body {
          min-width: 320px;
          min-height: 100vh;
          margin: 0;
          background: #f6f8fa;
        }

        .outage-page {
          min-height: 100vh;
          display: grid;
          grid-template-rows: auto 1fr auto;
          padding: 0 32px;
        }

        .site-header,
        .site-footer {
          display: flex;
          align-items: center;
          justify-content: space-between;
          color: #697586;
          font-size: 13px;
        }

        .site-header {
          width: min(100%, 1080px);
          min-height: 72px;
          margin: 0 auto;
          border-bottom: 1px solid #e5e9ef;
        }

        .brand {
          color: #202938;
          font-size: 15px;
          font-weight: 650;
          letter-spacing: -0.02em;
        }

        .message {
          width: min(100%, 520px);
          align-self: center;
          justify-self: center;
          padding: 48px 0;
          text-align: center;
        }

        .status {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 22px;
          padding: 7px 11px;
          border: 1px solid #e7eaf0;
          border-radius: 999px;
          background: #fff;
          color: #586579;
          font-size: 12px;
          font-weight: 500;
        }

        h1 {
          margin: 0;
          color: #202938;
          font-size: clamp(30px, 5vw, 40px);
          font-weight: 600;
          letter-spacing: -0.04em;
          line-height: 1.15;
        }

        .description {
          max-width: 410px;
          margin: 14px auto 0;
          color: #697586;
          font-size: 15px;
          line-height: 1.7;
        }

        .detail {
          margin-top: 20px;
          color: #8792a2;
          font-size: 12px;
        }

        .retry {
          min-height: 42px;
          margin-top: 26px;
          padding: 0 18px;
          border: 1px solid #2457c5;
          border-radius: 6px;
          background: #2457c5;
          color: #fff;
          cursor: pointer;
          font: inherit;
          font-size: 13px;
          font-weight: 600;
          transition: background-color 150ms ease, border-color 150ms ease;
        }

        .retry:hover {
          border-color: #1d48a5;
          background: #1d48a5;
        }

        .retry:focus-visible {
          outline: 3px solid #9bb8f5;
          outline-offset: 3px;
        }

        .site-footer {
          width: min(100%, 1080px);
          min-height: 62px;
          margin: 0 auto;
          border-top: 1px solid #e5e9ef;
          color: #8792a2;
          font-size: 12px;
        }

        @media (max-width: 480px) {
          .outage-page {
            padding: 0 20px;
          }

          .site-header {
            min-height: 64px;
          }

          .message {
            padding: 36px 0;
          }

          .site-footer {
            min-height: 58px;
            font-size: 11px;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .retry {
            transition: none;
          }
        }
      </style>

      <header class="site-header">
        <span class="brand">ExpoTradex</span>
      </header>

      <section class="message" aria-labelledby="outage-title">
        <div class="status">Service temporarily unavailable</div>
        <h1 id="outage-title">We’ll be back soon.</h1>
        <p class="description">
          We’re having trouble loading the site right now. Please try again in a few minutes.
        </p>
        <button class="retry" type="button" onclick="window.location.reload()">Try again</button>
        <div class="detail">Thank you for your patience.</div>
      </section>

      <footer class="site-footer">
        <span>ExpoTradex</span>
        <span>We apologize for the inconvenience.</span>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
